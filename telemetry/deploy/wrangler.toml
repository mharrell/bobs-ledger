# The telemetry collector + release server, as deployed 2026-10-01.
# (Reconstructed into the repo 2026-10-02 from telemetry/README.md's
# deploy notes — the first deploy ran without a checked-in config, which
# made redeploys unreproducible. The live worker's only non-default
# settings are the name, the workers.dev subdomain bobs-ledger, and the
# KV binding below.)
#
# Redeploy:
#   cd telemetry && npx wrangler deploy -c deploy/wrangler.toml
#
# TELEMETRY_KEY is a secret, not config:
#   printf '%s' "$KEY" | npx wrangler secret put TELEMETRY_KEY

name = "hearth-telemetry-collector"
main = "../collector.js"
compatibility_date = "2026-09-30"

[[kv_namespaces]]
binding = "BUCKET"
id = "abd7803c581b4470a2834e92ae0006a2"

# Throttling for the open write path (POST /session).
#
# This is the Worker-level rate limiter rather than a WAF rate limiting RULE,
# because rules are zone-scoped and a workers.dev hostname is not a zone in
# this account — there is no Security/WAF page for it at all (2026-10-03).
# The limit is per Cloudflare location, so it stops one source flooding from
# one place, which is the case that protects the 1 GB namespace and the 1,000
# writes/day; a distributed attacker still gets N x the allowance.
[[ratelimits]]
name = "SESSION_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Retention: session reports older than 90 days are deleted daily. Anonymous
# by design means no one can ask for a specific report to be removed, so a
# window is the only honest answer to "delete mine" - and it bounds what a
# flood can cost in a 1 GB namespace. The sweep lives in collector.js
# (RETENTION_DAYS) and can be run by hand with POST /sessions/sweep.
[triggers]
crons = ["0 4 * * *"]
